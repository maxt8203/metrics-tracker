[project]
name = "metrics-tracker"
version = "0.1.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Small, enforced set (blocking in CI): pyflakes, pycodestyle, isort, bugbear, pyupgrade.
select = ["F", "E", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E731"]  # lambda stubs are fine in tests
